
name: Build Tinium Development APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build ARM64 GMS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/restore-signing-keystore.sh debug "$HOME/.android/debug.keystore"

      - name: Build ARM64 GMS Debug APK
        run: |
          ./gradlew :app:assembleArm64GmsDebug \
            --stacktrace \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIVI-Music-ARM64-GMS
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored debug keystore
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
