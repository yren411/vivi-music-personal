name: Production Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New immutable candidate version (X.Y.Z); versioned notes, unreleased draft or internal-testing fallback'
        required: true
        type: string
        default: '6.0.8'

permissions:
  contents: read

jobs:
  allocate_version:
    name: Reserve coordinated version code (no publication)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tinium-release-registry
      cancel-in-progress: false
    outputs:
      code: ${{ steps.allocate.outputs.code }}
      tag: ${{ steps.allocate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Allocate or reuse immutable candidate version
        id: allocate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version_name }}
        run: python3 scripts/manage_releases.py allocate --channel stable --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"

  build_release:
    name: Build Signed Production APK Artifacts
    needs: allocate_version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version_name }}
      RELEASE_CODE: ${{ needs.allocate_version.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read reserved release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/manage_releases.py plan --channel stable --version "$RELEASE_VERSION" --code "$RELEASE_CODE" --commit "$GITHUB_SHA" --output candidate-plan.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set temporary release keystore path
        run: echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tinium-signing/release.keystore" >> "$GITHUB_ENV"

      - name: Restore permanent release keystore
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/restore-signing-keystore.sh release "$ANDROID_KEYSTORE_PATH"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build GMS and FOSS release APKs with the same reserved version
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VIVI_GITHUB_CLIENT_ID: ${{ secrets.VIVI_GITHUB_CLIENT_ID }}
          VIVI_GITHUB_CLIENT_SECRET: ${{ secrets.VIVI_GITHUB_CLIENT_SECRET }}
        run: |
          ./gradlew :app:assembleUniversalGmsRelease :app:assembleUniversalFossRelease \
            -PreleaseVersionCode="$RELEASE_CODE" -PreleaseVersionName="$RELEASE_VERSION" \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Verify signing, APK identity/versions and prepare exact test artifacts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 scripts/manage_releases.py prepare --plan candidate-plan.json \
            --gms app/build/outputs/apk/universalGms/release/app-universal-gms-release.apk \
            --foss app/build/outputs/apk/universalFoss/release/app-universal-foss-release.apk \
            --directory release_assets

      - name: Upload immutable candidate APKs and release metadata for testing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 30

      - name: Remove restored release keystore
        if: always()
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
